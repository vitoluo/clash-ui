name: 发布 Release

on:
  push:
    tags:
    - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: 构建目标
        required: false
        default: all
        type: choice
        options:
        - all
        - windows-x86_64
        - linux-x86_64
        - macos-x86_64
        - macos-arm64

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 选择构建目标
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
    - name: 生成构建矩阵
      id: select
      shell: bash
      env:
        SELECTED_TARGET: ${{ inputs.target || 'all' }}
      run: |
        set -euo pipefail
        matrix='[
          {"id":"windows-x86_64","name":"Windows x86_64 portable","runner":"windows-2025","platform":"windows","target":"x86_64-pc-windows-msvc","core_asset":"mihomo-windows-amd64-compatible","core_archive":"zip","artifact":"windows-x86_64-portable","package_suffix":"windows-x86_64-portable.zip"},
          {"id":"linux-x86_64","name":"Linux x86_64 AppImage","runner":"ubuntu-24.04","platform":"linux","target":"x86_64-unknown-linux-gnu","core_asset":"mihomo-linux-amd64-compatible","core_archive":"gz","artifact":"linux-x86_64-appimage","package_suffix":"linux-x86_64.AppImage"},
          {"id":"macos-x86_64","name":"macOS x86_64","runner":"macos-15-intel","platform":"macos","target":"x86_64-apple-darwin","core_asset":"mihomo-darwin-amd64-compatible","core_archive":"gz","artifact":"macos-x86_64","package_suffix":"macos-x86_64.app.zip"},
          {"id":"macos-arm64","name":"macOS arm64","runner":"macos-14","platform":"macos","target":"aarch64-apple-darwin","core_asset":"mihomo-darwin-arm64","core_archive":"gz","artifact":"macos-arm64","package_suffix":"macos-arm64.app.zip"}
        ]'

        if [[ "$SELECTED_TARGET" == "all" ]]; then
          selected="$matrix"
        else
          selected="$(jq -c --arg id "$SELECTED_TARGET" '[.[] | select(.id == $id)]' <<< "$matrix")"
        fi

        if [[ "$(jq 'length' <<< "$selected")" -eq 0 ]]; then
          echo "::error::不支持的构建目标：$SELECTED_TARGET"
          exit 1
        fi

        output="$(jq -cn --argjson entries "$selected" '{"include": $entries}')"
        echo "matrix=$output" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: 构建 ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_API_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 配置 APT 镜像
      if: matrix.platform == 'linux'
      uses: vegardit/fast-apt-mirror.sh@v1
    - name: 安装 Linux 构建依赖
      if: matrix.platform == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libfontconfig1-dev \
          libfreetype6-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          libxdo-dev \
          libwayland-dev \
          libx11-dev \
          libx11-xcb-dev \
          libxcb-cursor-dev \
          libxcb-render0-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxcb-xkb-dev \
          libxcb1-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev

    - name: 安装 Rust 工具链
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: 缓存 Rust 构建
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "."

    - name: 编译发布版本
      run: cargo build --locked --release --target "${{ matrix.target }}"

    - name: 组装 Windows portable 包
      if: matrix.platform == 'windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $version = $env:GITHUB_REF_NAME -replace '[^A-Za-z0-9._-]', '-'
        $stage = Join-Path $env:RUNNER_TEMP "clash-ui-$version-windows"
        $coreExtract = Join-Path $env:RUNNER_TEMP "mihomo-windows"
        $resources = Join-Path $stage "resources\clash"
        $package = Join-Path $env:RUNNER_TEMP "clash-ui-$version-${{ matrix.package_suffix }}"
        $headers = @{
          Accept = "application/vnd.github+json"
          "User-Agent" = "clash-ui-release-workflow"
          "X-GitHub-Api-Version" = "2022-11-28"
        }

        Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -LiteralPath $coreExtract -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -LiteralPath $package -Force -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path $resources | Out-Null
        New-Item -ItemType Directory -Force -Path $coreExtract | Out-Null
        $rcedit = Join-Path $env:RUNNER_TEMP "rcedit-x64.exe"
        Invoke-WebRequest -Uri "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile $rcedit
        $releaseExecutable = "target\${{ matrix.target }}\release\clash-ui.exe"
        & $rcedit $releaseExecutable `
          --set-icon "icons\app.ico" `
          --set-version-string ProductName "clash-ui" `
          --set-version-string FileDescription "Clash 图形客户端"
        if ($LASTEXITCODE -ne 0) {
          throw "Windows 应用图标嵌入失败"
        }
        Copy-Item $releaseExecutable (Join-Path $stage "clash-ui.exe")
        Copy-Item "target\${{ matrix.target }}\release\clash-ui-uwp-helper.exe" (Join-Path $stage "clash-ui-uwp-helper.exe")

        $mihomo = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"
        $mihomoAsset = "${{ matrix.core_asset }}-$($mihomo.tag_name).${{ matrix.core_archive }}"
        $mihomoArchive = Join-Path $env:RUNNER_TEMP $mihomoAsset
        Invoke-WebRequest -Headers $headers -Uri "https://github.com/MetaCubeX/mihomo/releases/download/$($mihomo.tag_name)/$mihomoAsset" -OutFile $mihomoArchive
        Expand-Archive -LiteralPath $mihomoArchive -DestinationPath $coreExtract -Force
        $mihomoBinary = Get-ChildItem -LiteralPath $coreExtract -Recurse -File -Filter "mihomo*.exe" | Select-Object -First 1
        if ($null -eq $mihomoBinary) {
          throw "mihomo 压缩包内未找到 mihomo*.exe"
        }
        Copy-Item $mihomoBinary.FullName (Join-Path $resources "clash.exe")

        foreach ($file in @("geoip.dat", "geosite.dat", "country.mmdb", "GeoLite2-ASN.mmdb")) {
          $destinationName = if ($file -eq "GeoLite2-ASN.mmdb") { "asn.mmdb" } else { $file }
          $destination = Join-Path $resources $destinationName
          Invoke-WebRequest -Headers $headers -Uri "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/$file" -OutFile $destination
          if ((Get-Item -LiteralPath $destination).Length -eq 0) {
            throw "$file 下载结果为空"
          }
        }

        Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $package -CompressionLevel Optimal

    - name: 组装 Linux AppImage
      if: matrix.platform == 'linux'
      shell: bash
      run: |
        set -euo pipefail
        version="$(printf '%s' "$GITHUB_REF_NAME" | tr -c '[:alnum:]._-' '-')"
        stage="$RUNNER_TEMP/clash-ui.AppDir"
        package="$RUNNER_TEMP/clash-ui-${version}-${{ matrix.package_suffix }}"
        api_headers=(
          -H "Accept: application/vnd.github+json"
          -H "X-GitHub-Api-Version: 2022-11-28"
          -H "Authorization: Bearer ${RELEASE_API_TOKEN}"
        )

        rm -rf "$stage"
        mkdir -p "$stage/usr/bin/resources/clash" \
          "$stage/usr/share/applications" \
          "$stage/usr/share/icons/hicolor/512x512/apps"
        cp "target/${{ matrix.target }}/release/clash-ui" "$stage/usr/bin/clash-ui"
        chmod +x "$stage/usr/bin/clash-ui"

        mihomo_tag="$(curl -fsSL --retry 3 "${api_headers[@]}" https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.tag_name')"
        mihomo_asset="${{ matrix.core_asset }}-${mihomo_tag}.${{ matrix.core_archive }}"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/$mihomo_asset" \
          "https://github.com/MetaCubeX/mihomo/releases/download/${mihomo_tag}/${mihomo_asset}"
        gzip -dc "$RUNNER_TEMP/$mihomo_asset" > "$stage/usr/bin/resources/clash/clash"
        chmod +x "$stage/usr/bin/resources/clash/clash"

        for file in geoip.dat geosite.dat country.mmdb; do
          curl -fsSL --retry 3 -o "$stage/usr/bin/resources/clash/$file" \
            "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/$file"
        done
        curl -fsSL --retry 3 -o "$stage/usr/bin/resources/clash/asn.mmdb" \
          "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"

        cp icons/app.png "$stage/usr/share/icons/hicolor/512x512/apps/clash-ui.png"
        cat > "$stage/usr/share/applications/clash-ui.desktop" <<'EOF'
        [Desktop Entry]
        Type=Application
        Name=Clash UI
        Exec=clash-ui
        Icon=clash-ui
        Categories=Network;
        Terminal=false
        EOF

        linuxdeploy="$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"
        curl -fsSL --retry 3 -o "$linuxdeploy" \
          https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        chmod +x "$linuxdeploy"
        indicator_library="/usr/lib/x86_64-linux-gnu/libayatana-appindicator3.so.1"
        test -f "$indicator_library"
        "$linuxdeploy" --appimage-extract-and-run \
          --appdir "$stage" \
          --executable "$stage/usr/bin/clash-ui" \
          --library "$indicator_library"

        rm -f "$stage/AppRun"
        cat > "$stage/AppRun" <<'EOF'
        #!/bin/sh
        set -eu
        here="${APPDIR:-}"
        if [ -z "$here" ] || [ ! -f "$here/usr/bin/clash-ui" ]; then
          here="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
        fi
        data_home="${XDG_DATA_HOME:-$HOME/.local/share}"
        runtime_root="$data_home/clash-ui/app"
        runtime_lib="$runtime_root/lib"
        mkdir -p "$runtime_root"
        cp "$here/usr/bin/clash-ui" "$runtime_root/clash-ui"
        rm -rf "$runtime_root/resources"
        rm -rf "$runtime_lib"
        cp -R "$here/usr/bin/resources" "$runtime_root/resources"
        cp -R "$here/usr/lib" "$runtime_lib"
        chmod +x "$runtime_root/clash-ui" "$runtime_root/resources/clash/clash"
        export LD_LIBRARY_PATH="$runtime_lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        exec "$runtime_root/clash-ui" "$@"
        EOF
        chmod +x "$stage/AppRun"

        appimagetool="$RUNNER_TEMP/appimagetool-x86_64.AppImage"
        curl -fsSL --retry 3 -o "$appimagetool" \
          https://github.com/AppImage/appimagetool/releases/latest/download/appimagetool-x86_64.AppImage
        chmod +x "$appimagetool"
        ARCH=x86_64 "$appimagetool" --appimage-extract-and-run "$stage" "$package"
        test -s "$package"

    - name: 组装 macOS 应用包
      if: matrix.platform == 'macos'
      shell: bash
      run: |
        set -euo pipefail
        version="$(printf '%s' "$GITHUB_REF_NAME" | tr -c '[:alnum:]._-' '-')"
        app="$RUNNER_TEMP/Clash UI.app"
        package="$RUNNER_TEMP/clash-ui-${version}-${{ matrix.package_suffix }}"
        api_headers=(
          -H "Accept: application/vnd.github+json"
          -H "X-GitHub-Api-Version: 2022-11-28"
          -H "Authorization: Bearer ${RELEASE_API_TOKEN}"
        )

        rm -rf "$app" "$package"
        iconset="$RUNNER_TEMP/clash-ui.iconset"
        rm -rf "$iconset"
        mkdir -p "$app/Contents/MacOS/resources/clash" "$app/Contents/Resources" "$iconset"
        cp "target/${{ matrix.target }}/release/clash-ui" "$app/Contents/MacOS/clash-ui"
        chmod +x "$app/Contents/MacOS/clash-ui"

        for size in 16 32 128 256 512; do
          sips -z "$size" "$size" icons/app.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
          double_size=$((size * 2))
          sips -z "$double_size" "$double_size" icons/app.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
        done
        iconutil -c icns "$iconset" -o "$app/Contents/Resources/clash-ui.icns"

        mihomo_tag="$(curl -fsSL --retry 3 "${api_headers[@]}" https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.tag_name')"
        mihomo_asset="${{ matrix.core_asset }}-${mihomo_tag}.${{ matrix.core_archive }}"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/$mihomo_asset" \
          "https://github.com/MetaCubeX/mihomo/releases/download/${mihomo_tag}/${mihomo_asset}"
        gzip -dc "$RUNNER_TEMP/$mihomo_asset" > "$app/Contents/MacOS/resources/clash/clash"
        chmod +x "$app/Contents/MacOS/resources/clash/clash"

        for file in geoip.dat geosite.dat country.mmdb; do
          curl -fsSL --retry 3 -o "$app/Contents/MacOS/resources/clash/$file" \
            "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/$file"
        done
        curl -fsSL --retry 3 -o "$app/Contents/MacOS/resources/clash/asn.mmdb" \
          "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"

        cat > "$app/Contents/Info.plist" <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleDisplayName</key>
          <string>Clash UI</string>
          <key>CFBundleExecutable</key>
          <string>clash-ui</string>
          <key>CFBundleIdentifier</key>
          <string>com.vito.clash-ui</string>
          <key>CFBundleIconFile</key>
          <string>clash-ui</string>
          <key>CFBundleName</key>
          <string>Clash UI</string>
          <key>CFBundlePackageType</key>
          <string>APPL</string>
          <key>CFBundleShortVersionString</key>
          <string>${version#v}</string>
          <key>CFBundleVersion</key>
          <string>${version#v}</string>
          <key>LSMinimumSystemVersion</key>
          <string>10.15</string>
          <key>NSHighResolutionCapable</key>
          <true/>
        </dict>
        </plist>
        EOF

        ditto -c -k --sequesterRsrc --keepParent "$app" "$package"
        test -s "$package"

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.artifact }}
        path: ${{ runner.temp }}/clash-ui-${{ github.ref_name }}-${{ matrix.package_suffix }}
        if-no-files-found: error
        retention-days: 7

  publish:
    name: 发布 GitHub Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: 下载全部构建产物
      uses: actions/download-artifact@v4
      with:
        pattern: release-*
        path: release-assets
        merge-multiple: true

    - name: 创建或更新 Release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
        else
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "Clash UI $GITHUB_REF_NAME" \
            --generate-notes
        fi
