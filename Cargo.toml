[package]
name = "clash-ui"
version = "1.0.1"
edition = "2021"
default-run = "clash-ui"

[dependencies]
chrono = "0.4"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "query", "json"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1"
serde_json = "1"
slint = { version = "1.18.1", features = ["unstable-winit-030", "system-tray"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
http = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
arboard = { version = "3", default-features = false }
rfd = "0.17"
webbrowser = "1"
auto-launch = "0.6"
dark-light = "3"
listeners = "0.6"
elevated-command = "1"
sysproxy = { git = "https://github.com/clash-verge-rev/sysproxy-rs.git", branch = "0.5.4" }
display-info = "0.5"
anyhow = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[build-dependencies]
lucide-slint = "1"
slint-build = "1.18.1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
incremental = false
debug = false

[profile.dev.build-override]
opt-level = 3

[profile.release]
codegen-units = 1 
lto = "thin"
strip = "symbols"
panic = "abort"
