[package]
name = "clash-ui"
version = "0.1.0"
edition = "2021"
default-run = "clash-ui"

[dependencies]
chrono = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.0.0"
serde_json = "1"
slint = { version = "1", features = ["unstable-winit-030", "system-tray"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
http = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
arboard = { version = "3", default-features = false }
rfd = "0.17"
webbrowser = "1.2"
auto-launch = "0.6"
dark-light = "2"
listeners = "0.6"
elevated-command = "1.1"
sysproxy = { git = "https://github.com/clash-verge-rev/sysproxy-rs.git", branch = "0.5.4" }
display-info = "0.5.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[build-dependencies]
lucide-slint = "1.28.0"
slint-build = "1"

# 配置开发环境 (cargo build) 的编译参数
[profile.dev]
opt-level = 0          # 启用基础优化，平衡编译速度与运行性能
incremental = true     # 开启增量编译，提升反复编译的速度
debug = 1              # 仅保留行号信息，减小体积、加快链接

# 针对所有依赖项进行优化
[profile.dev.package."*"]
incremental = false    # 关闭依赖的增量编译以节省磁盘空间

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
panic = "abort"
codegen-units = 1 
