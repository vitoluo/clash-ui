[package]
name = "clash-ui"
version = "0.1.0"
edition = "2021"
default-run = "clash-ui"

[dependencies]
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.0.0"
serde_json = "1"
slint = { version = "1", features = ["unstable-winit-030"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
tray-icon = "0.20"
http = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
resvg = { version = "0.47", default-features = false }
arboard = { version = "3", default-features = false }
rfd = "0.17"
webbrowser = "1.2"
auto-launch = "0.6"
dark-light = "2"
listeners = "0.6"
elevated-command = "1.1"
sysproxy = { git = "https://github.com/clash-verge-rev/sysproxy-rs.git", branch = "0.5.4" }
display-info = "0.5.9"

[build-dependencies]
lucide-slint = "1.28.0"
slint-build = "1"

# 构建期 Windows 资源（图标）嵌入，仅 Windows。
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

# 配置开发环境 (cargo build) 的编译参数
[profile.dev]
opt-level = 0          # 启用基础优化，平衡编译速度与运行性能
incremental = true     # 开启增量编译，提升反复编译的速度
debug = 1              # 仅保留行号信息，减小体积、加快链接
codegen-units = 16     # 充分利用多核CPU进行并行编译

# 针对所有依赖项进行优化，防止内存占用过高 (OOM)
[profile.dev.package."*"]
codegen-units = 16
incremental = false    # 关闭依赖的增量编译以节省磁盘空间
